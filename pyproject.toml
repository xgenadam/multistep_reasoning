[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-sub-agents"
version = "0.1.0"
description = "Decompose -> execute -> compose -> render harness over a revisable Document"
readme = "README.md"
# <3.13: instructor 1.3.* needs jiter<0.5, which has no 3.13 wheel and
# cannot build for 3.13 (PyO3 0.21). Lift together with the instructor
# upgrade ticket.
requires-python = ">=3.12,<3.13"
dependencies = [
    # 1.109 / 1.3.2 are the versions the instrumentation seam is known-good
    # with (journal/tickets/O-03.md). Upgrading instructor is its own ticket.
    "openai>=1.109,<2",
    "instructor==1.3.*",
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest"]
tokens = ["tiktoken"]

[tool.setuptools.packages.find]
# oobabooga_extension/ is copied into the webui, not installed.
include = ["reasoning_sub_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
