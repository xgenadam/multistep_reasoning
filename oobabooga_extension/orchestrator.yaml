# No default endpoint (D-P): set host + port or base_url here, or export
# LLM_BASE_URL (which overrides this block). 8000 is the host-side
# Devstral server; from the agent container use
# http://host.containers.internal:5000/v1.
llm:
  host: 127.0.0.1
  port: 8000

components:
  decomposer: self_critique
  executor: oracle_loop
  composer: document
  oracle: document_oracle

options:
  max_oracle_rounds: 8
  summary_max_words: 400
  render: markdown_with_files
  composer_max_retries: 3
  log_prompts: false
