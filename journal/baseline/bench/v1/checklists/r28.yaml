id: r28
# Dijkstra from A (no ties arise):
#   init      A0  B∞  C∞  D∞  E∞  F∞
#   settle A  B=4 (A-B), C=2 (A-C)
#   settle C  B=min(4, 2+1)=3, D=2+8=10, E=2+10=12
#   settle B  D=min(10, 3+5)=8
#   settle D  E=min(12, 8+2)=10, F=8+6=14
#   settle E  F=min(14, 10+3)=13
#   settle F
# Final: A 0, B 3, C 2, D 8, E 10, F 13; F's path A → C → B → D → E → F
# Trace table: initial row + 6 settled = 7 body rows
items:
  - {id: words, check: word_count, min: 720, max: 1100}   # "about 800-1,000": ±10 %
  - {id: trace-rows, check: table_rows, section: '(?i)trace|step.by.step', min: 7, max: 7}
  - {id: dist-b, check: number, section: '(?i)final', pattern: '(?m)^[^\w\n]*B[^\w\n]*[|:=][^\w\n]*(\d+)', value: 3}
  - {id: dist-c, check: number, section: '(?i)final', pattern: '(?m)^[^\w\n]*C[^\w\n]*[|:=][^\w\n]*(\d+)', value: 2}
  - {id: dist-d, check: number, section: '(?i)final', pattern: '(?m)^[^\w\n]*D[^\w\n]*[|:=][^\w\n]*(\d+)', value: 8}
  - {id: dist-e, check: number, section: '(?i)final', pattern: '(?m)^[^\w\n]*E[^\w\n]*[|:=][^\w\n]*(\d+)', value: 10}
  - {id: dist-f, check: number, section: '(?i)final', pattern: '(?m)^[^\w\n]*F[^\w\n]*[|:=][^\w\n]*(\d+)', value: 13}
  - {id: path-f, check: contains, section: '(?i)final', pattern: 'A\W{1,5}C\W{1,5}B\W{1,5}D\W{1,5}E\W{1,5}F'}
  - {id: three-mistakes, check: bullet_items, section: '(?i)mistake|pitfall', min: 3, max: 3}
