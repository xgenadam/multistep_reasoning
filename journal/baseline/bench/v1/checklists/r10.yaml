id: r10
# Scores (L x I): data types 4x5=20; cutover overrun 4x4=16; MySQL-specific SQL 5x3=15; CDC lag 3x4=12;
# reporting 2x5=10; rollback 2x4=8; ops unfamiliar 3x2=6; CDC licence 4x1=4.
# Sorted: 20, 16, 15, 12, 10, 8, 6, 4 (all distinct, so the order is unique).
# Row k's score is the 5th cell of the row whose # cell is k (columns: #, Risk, Likelihood, Impact, Score, ...).
items:
  - {id: words, check: word_count, min: 540, max: 880}   # "about 600-800": ±10 %
  - {id: sec-scoring, check: heading, pattern: '(?i)scor|scale|method'}
  - {id: sec-register, check: heading, pattern: '(?i)register'}
  - {id: sec-top3, check: heading, pattern: '(?i)\btop\b'}
  - {id: eight-rows, check: table_rows, section: '(?i)register', min: 8, max: 8}
  - {id: rank1-score, check: number, section: '(?i)register', pattern: '(?m)^\|\s*\**1\**\s*\|[^|\n]*\|[^|\n]*\|[^|\n]*\|\s*\**(\d+)', value: 20}
  - {id: rank3-score, check: number, section: '(?i)register', pattern: '(?m)^\|\s*\**3\**\s*\|[^|\n]*\|[^|\n]*\|[^|\n]*\|\s*\**(\d+)', value: 15}
  - {id: rank5-score, check: number, section: '(?i)register', pattern: '(?m)^\|\s*\**5\**\s*\|[^|\n]*\|[^|\n]*\|[^|\n]*\|\s*\**(\d+)', value: 10}
  - {id: rank8-score, check: number, section: '(?i)register', pattern: '(?m)^\|\s*\**8\**\s*\|[^|\n]*\|[^|\n]*\|[^|\n]*\|\s*\**(\d+)', value: 4}
  - {id: owners, check: contains, section: '(?i)register', pattern: '(?i)\b(dba lead|backend lead|qa lead|sre lead|product owner)\b', min: 8}
  - {id: top3-items, check: numbered_items, section: '(?i)\btop\b', min: 3, max: 3}
