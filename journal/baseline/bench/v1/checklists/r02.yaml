id: r02
items:
  - {id: words, check: word_count, min: 540, max: 880}   # "about 600-800": ±10 %
  - {id: sec-summary, check: heading, pattern: '(?i)^\W*(?:incident |executive )?summary\b'}
  - {id: sec-timeline, check: heading, pattern: '(?i)timeline'}
  - {id: sec-root-cause, check: heading, pattern: '(?i)root\s*cause|cause'}
  - {id: sec-actions, check: heading, pattern: '(?i)action'}
  # impact 14:07 (first customer-facing errors) to 15:52 (back below baseline) = 53 + 52 = 105 min
  - {id: duration, check: number, section: '(?i)^\W*(?:incident |executive )?summary\b', pattern: '(?i)duration[^\d\n]{0,30}(\d+)', value: 105}
  - {id: timeline-rows, check: table_rows, section: '(?i)timeline', min: 14, max: 14}   # 14 timestamps in the log
  - {id: five-actions, check: numbered_items, section: '(?i)action', min: 5, max: 5}
  - {id: blameless, check: not_contains, pattern: '(?i)\b(priya|natarajan|tomasz|wierzbicki|dana|okafor)\b'}
