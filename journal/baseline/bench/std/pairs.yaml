    If it is possible, print the minimum number of operations required to do so.

    Here, grid A is identical to grid B if and only if, for all pairs of integers (i, j) satisfying 1
    \leq i \leq H and 1 \leq j \leq W, the integer written in cell (i, j) of grid A is equal to the integer
    written in cell (i, j) of grid B.


